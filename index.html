<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahmedabad Metro Kiosk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">M</span>
        <span id="brand-name">Ahmedabad Metro</span>
      </div>
      <div class="top-actions">
        <button id="btn-lang" class="chip-btn" aria-label="Change language">
          <span class="chip-sym">અ अ Aa</span>
        </button>
        <button id="btn-home" class="round-btn" aria-label="Start again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </button>
      </div>
    </header>

    <main class="split">
      <section class="map-side">
        <div id="map"></div>
        <div id="map-legend" class="map-legend"></div>
        <div id="station-guide" class="station-guide" hidden></div>
      </section>
      <aside id="panel" class="panel" aria-live="polite"></aside>
    </main>

    <div id="demo-preview" class="demo-preview" hidden></div>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/pictograms.js"></script>
  <script src="js/map.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ticket.js"></script>
  <script src="js/train.js"></script>
</body>
</html>
